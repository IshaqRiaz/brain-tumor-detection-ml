<!DOCTYPE html>
<html>
<head>
    <title>Brain Tumor Detection</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container text-center mt-5">

    <h1 class="mb-4">🧠 Brain Tumor Detection System</h1>
    <p class="text-muted">Upload an MRI scan to detect tumor</p>

    <form action="/predict" method="POST" enctype="multipart/form-data" onsubmit="showLoading()">
        
        <input class="form-control mb-3" type="file" name="image" required>

        <button class="btn btn-primary px-4">Predict</button>

    </form>

    <!-- Loading message -->
    <p id="loading" class="mt-3 text-primary" style="display:none;">
        ⏳ Processing image... Please wait
    </p>

</div>

<script>
function showLoading() {
    document.getElementById("loading").style.display = "block";
}
</script>

</body>
</html>
